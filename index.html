<!doctype html>
<html lang="en">
  <head>
    <title>Runner Gallery</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="keywords" content="RunCat,RunCat Neo,runner,custom,gallery,animation,menubar" />
    <meta name="author" content="Kyome22" />
    <meta name="description" content="A gallery of custom runners for RunCat Neo." />
    <meta property="og:url" content="https://runcat-dev.github.io/RunnerGallery/index.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Runner Gallery" />
    <meta property="og:description" content="A gallery of custom runners for RunCat Neo." />
    <meta property="og:site_name" content="Runner Gallery" />
    <link href="https://fonts.googleapis.com/css?family=Exo+2:400,400i,600,600i" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <header>
      <div>
        <a class="title" href="./index.html"> Runner Gallery </a>
        <a
          href="https://github.com/runcat-dev/RunnerGallery"
          title="Link for GitHub Repository"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg class="github-icon" viewBox="0 0 24 24">
            <path
              d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2 0 1.9 1.2 1.9 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8 0 3.2.9.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1 .9 2.2v3.3c0 .3.1.7.8.6A12 12 0 0 0 12 .3"
            ></path>
          </svg>
        </a>
      </div>
    </header>
    <div class="main">
      <div class="summary">
        <p class="title">Runner Gallery</p>
        <p class="catchcopy">Custom runners for RunCat Neo.</p>
        <p class="short-description">Browse, download, and import your favorites.</p>
      </div>
      <section class="gallery">
        <div class="filters" id="filters" hidden>
          <div class="tabs" id="tabs" role="tablist"></div>
          <div class="tag-chips" id="tag-chips"></div>
        </div>
        <p class="gallery-status" id="gallery-status">Loading runners…</p>
        <div class="runner-grid" id="runner-grid"></div>
      </section>
      <section class="contribute">
        <p>
          Want to share your own runner? Contributions are welcome via
          <a
            href="https://github.com/runcat-dev/RunnerGallery/blob/main/CONTRIBUTING.md"
            target="_blank"
            rel="noopener noreferrer"
            >Pull Request</a
          >.
        </p>
      </section>
    </div>
    <footer>
      <nav>
        <a
          href="https://runcat-dev.github.io/RunCatNeo/"
          target="_blank"
          rel="noopener noreferrer"
          >RunCat Neo</a
        >
        <a
          href="https://github.com/runcat-dev/RunnerGallery"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub Repository</a
        >
      </nav>
      <p>© 2026 Takuto Nakamura (Kyome22)</p>
    </footer>
  </body>
</html>
